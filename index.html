<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>La Última Expedición · Misaelverse 6.°</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#070714;--p1:#0d0d22;--p2:#131330;--p3:#1a1a40;--ln:#26264d;--cy:#00e5ff;--mg:#ff2bd6;--vi:#9d6bff;--ok:#38f59a;--bad:#ff5470;--am:#ffd166;--or:#ff9f43;--bl:#4f8bff;--tx:#ecebff;--mu:#a6a6d4;--r:14px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:'Rajdhani',system-ui,sans-serif;font-size:18px;line-height:1.4;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;background:radial-gradient(1200px 600px at 80% -10%,#1b0f3a 0%,transparent 60%),radial-gradient(900px 500px at -10% 110%,#06283a 0%,transparent 60%),var(--bg)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(157,107,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(157,107,255,.06) 1px,transparent 1px);background-size:44px 44px;mask-image:linear-gradient(180deg,#000 0%,transparent 85%)}
h1,h2,h3,h4{font-family:'Orbitron',sans-serif;font-weight:700;letter-spacing:.03em;margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:disabled{cursor:default;opacity:.55}
:focus-visible{outline:3px solid var(--mg);outline-offset:3px}
input,textarea,select{font:inherit;color:var(--tx);background:var(--p1);border:2px solid var(--ln);border-radius:12px;padding:12px 14px;width:100%}
input:focus,textarea:focus,select:focus{border-color:var(--cy);outline:none;box-shadow:0 0 0 4px rgba(0,229,255,.15)}
.wrap{max-width:1100px;margin:0 auto;padding:16px 16px 70px;position:relative}
.oculto{display:none!important}
.btn{font-family:'Orbitron',sans-serif;font-size:.8rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:14px 22px;border-radius:12px;background:linear-gradient(135deg,var(--cy),var(--vi));color:#070714;box-shadow:0 6px 24px rgba(0,229,255,.25);transition:transform .12s,box-shadow .12s}
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 10px 30px rgba(0,229,255,.35)}
.btn.sec{background:var(--p2);color:var(--tx);border:2px solid var(--ln);box-shadow:none}
.btn.mg{background:linear-gradient(135deg,var(--mg),var(--vi));color:#fff}
.btn.peligro{background:linear-gradient(135deg,var(--bad),var(--mg));color:#fff}
.btn.chico{padding:9px 14px;font-size:.68rem}
.enlace{color:var(--cy);text-decoration:underline;font-size:.95rem;padding:6px}
.panel{background:linear-gradient(180deg,rgba(19,19,48,.92),rgba(13,13,34,.92));border:2px solid var(--ln);border-radius:var(--r);padding:22px}
.centro{text-align:center}
.mu{color:var(--mu)}
.fila{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.fila.fin{justify-content:flex-end}
.fila.entre{justify-content:space-between}

/* ---------- HUD ---------- */
.hud{position:sticky;top:0;z-index:20;background:rgba(7,7,20,.88);backdrop-filter:blur(8px);border-bottom:1px solid var(--ln)}
.hud .in{max-width:1100px;margin:0 auto;padding:8px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.hud .quien{font-family:'Orbitron',sans-serif;font-size:.78rem;display:flex;gap:8px;align-items:center;min-width:0}
.hud .quien b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--p2);border:1px solid var(--ln);font-weight:700;font-size:.9rem;white-space:nowrap}
.chip.curso{color:var(--cy)}
.hud .esp{flex:1}
.gemas{display:flex;gap:4px}
.gema{width:16px;height:16px}
.estado-guardado{width:10px;height:10px;border-radius:50%;background:var(--mu);display:inline-block}
.estado-guardado.ok{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.estado-guardado.pend{background:var(--am);animation:lat 1s infinite}
.estado-guardado.err{background:var(--bad);animation:lat .6s infinite}
@keyframes lat{50%{opacity:.3}}
.btn-icono{width:36px;height:36px;border-radius:10px;background:var(--p2);border:1px solid var(--ln);display:grid;place-items:center}
.btn-icono svg{width:18px;height:18px}

/* ---------- Login ---------- */
.portada{display:grid;gap:22px;grid-template-columns:1.1fr .9fr;align-items:center;min-height:calc(100vh - 40px);padding-top:10px}
.titulo-juego{font-size:clamp(1.7rem,4.6vw,3.1rem);line-height:1.05;background:linear-gradient(90deg,var(--cy),var(--mg) 60%,var(--am));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px rgba(255,43,214,.25))}
.sub-juego{font-family:'Orbitron',sans-serif;font-size:.8rem;letter-spacing:.3em;color:var(--mu);margin:10px 0 18px;text-transform:uppercase}
.cursos{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:8px 0 16px}
.curso-btn{padding:18px;border-radius:14px;border:2px solid var(--ln);background:var(--p1);font-family:'Orbitron',sans-serif;font-size:1.5rem;font-weight:900;transition:.15s}
.curso-btn span{display:block;font-family:'Rajdhani',system-ui,sans-serif;font-size:.85rem;color:var(--mu);font-weight:600;letter-spacing:.05em}
.curso-btn.sel{border-color:var(--cy);background:rgba(0,229,255,.1);box-shadow:0 0 0 4px rgba(0,229,255,.12)}
.etq{font-family:'Orbitron',sans-serif;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mu);display:block;margin-bottom:6px}
.msg{min-height:1.6em;margin:10px 0 0;font-weight:600}
.msg.err{color:var(--bad)}
.msg.ok{color:var(--ok)}
.sacudir{animation:sac .35s}
@keyframes sac{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.escena-byte{display:grid;place-items:center}
.escena-byte svg{width:min(360px,80vw);height:auto;filter:drop-shadow(0 0 30px rgba(0,229,255,.25))}

/* ---------- BYTE + burbuja ---------- */
.byte-dice{display:flex;gap:14px;align-items:flex-start;margin:0 0 18px}
.byte-dice .cara{flex:0 0 64px;width:64px;height:64px}
.burbuja{position:relative;background:var(--p2);border:2px solid var(--cy);border-radius:14px;padding:12px 16px;font-size:1.05rem;font-weight:600}
.burbuja::before{content:"";position:absolute;left:-10px;top:18px;border:8px solid transparent;border-right-color:var(--cy);border-left:0}

/* ---------- Intro ---------- */
.reglas{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin:16px 0 20px}
.regla{background:var(--p1);border:1px solid var(--ln);border-radius:12px;padding:14px;display:flex;gap:10px;align-items:flex-start}
.regla svg{flex:0 0 28px;width:28px;height:28px}
.regla b{display:block;font-family:'Orbitron',sans-serif;font-size:.74rem;letter-spacing:.06em;margin-bottom:2px;color:var(--cy)}

/* ---------- Mapa ---------- */
.mapa-cab{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.mapa-cab h2{font-size:1.25rem}
.ritmo{font-weight:700;font-size:.95rem}
.ritmo.bien{color:var(--ok)}.ritmo.ojo{color:var(--am)}.ritmo.tarde{color:var(--bad)}
.mapa{width:100%;height:auto;display:block;border-radius:18px;border:2px solid var(--ln);background:radial-gradient(circle at 50% 40%,#12123a 0%,#08081a 70%)}
.nodo{cursor:pointer}
.nodo.bloq{cursor:not-allowed}
.nodo .halo{transform-box:fill-box;transform-origin:center;animation:halo 1.8s ease-in-out infinite}
@keyframes halo{50%{transform:scale(1.18);opacity:.25}}
.nodo:hover .cuerpo{filter:brightness(1.25)}
.nodo text{font-family:'Orbitron',sans-serif;font-weight:700;fill:var(--tx)}
.lista-estaciones{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:12px}
.le{display:flex;gap:8px;align-items:center;background:var(--p1);border:1px solid var(--ln);border-radius:10px;padding:8px 10px;font-weight:700;font-size:.92rem;text-align:left}
.le .pt{margin-left:auto;font-family:'Orbitron',sans-serif;font-size:.7rem;color:var(--mu)}
.le.bloq{opacity:.45}
.le .dot{width:12px;height:12px;border-radius:50%;flex:0 0 12px}

/* ---------- Bitácora ---------- */
.bitacora .cab{display:flex;gap:16px;align-items:center;margin-bottom:14px}
.ico-est{width:62px;height:62px;flex:0 0 62px;border-radius:16px;display:grid;place-items:center}
.ico-est svg{width:38px;height:38px}
.bitacora ul{margin:8px 0 18px;padding:0;list-style:none;display:grid;gap:8px}
.bitacora li{background:var(--p1);border-left:4px solid var(--c,var(--cy));border-radius:8px;padding:10px 14px;font-weight:600}
.bitacora li b{color:var(--c,var(--cy))}

/* ---------- Reto ---------- */
.reto-cab{display:flex;gap:12px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.reto-cab .nom{font-family:'Orbitron',sans-serif;font-size:.78rem;letter-spacing:.08em}
.progreso-reto{display:flex;gap:5px;margin-left:auto}
.progreso-reto i{width:22px;height:8px;border-radius:4px;background:var(--ln)}
.progreso-reto i.hecho{background:var(--c,var(--cy))}
.progreso-reto i.act{background:#fff;box-shadow:0 0 8px #fff}
.tipo{font-family:'Orbitron',sans-serif;font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;padding:4px 9px;border-radius:999px;border:1px solid var(--c,var(--cy));color:var(--c,var(--cy))}
.pregunta{font-size:1.32rem;font-weight:700;line-height:1.3;margin:4px 0 16px}
.visual{margin:0 0 16px;overflow-x:auto}
.opciones{display:grid;gap:10px}
.op{display:flex;gap:12px;align-items:center;text-align:left;background:var(--p1);border:2px solid var(--ln);border-radius:12px;padding:12px 14px;font-weight:600;font-size:1.05rem;transition:.12s;width:100%}
.op .letra{flex:0 0 32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--p3);font-family:'Orbitron',sans-serif;font-size:.8rem}
.op:hover:not(:disabled){border-color:var(--c,var(--cy))}
.op.sel{border-color:var(--c,var(--cy));background:rgba(0,229,255,.08)}
.op.bien{border-color:var(--ok);background:rgba(56,245,154,.12)}
.op.mal{border-color:var(--bad);background:rgba(255,84,112,.12);text-decoration:line-through;opacity:.8}
.vf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vf .op{justify-content:center;font-family:'Orbitron',sans-serif;font-size:1rem;padding:22px}
.acciones{display:flex;gap:10px;justify-content:flex-end;align-items:center;margin-top:16px;flex-wrap:wrap}
.acciones .nota-intento{margin-right:auto;color:var(--am);font-weight:700}

/* ordenar */
.ordenar{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.col-t{font-family:'Orbitron',sans-serif;font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mu);margin-bottom:6px}
.pool,.slots{display:grid;gap:8px;align-content:start}
.pieza{background:var(--p1);border:2px dashed var(--ln);border-radius:10px;padding:10px 12px;font-weight:600;text-align:left;width:100%}
.pieza:hover:not(:disabled){border-color:var(--c,var(--cy))}
.slot{display:flex;gap:10px;align-items:center;min-height:48px;border-radius:10px;border:2px solid var(--ln);background:rgba(255,255,255,.02);padding:6px 10px;text-align:left;width:100%;font-weight:600}
.slot .n{flex:0 0 28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--p3);font-family:'Orbitron',sans-serif;font-size:.75rem}
.slot.lleno{border-color:var(--c,var(--cy))}
.slot.bien{border-color:var(--ok);background:rgba(56,245,154,.1)}
.slot.mal{border-color:var(--bad);background:rgba(255,84,112,.1)}

/* unir */
.unir{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.u-item{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:var(--p1);border:2px solid var(--ln);border-radius:10px;padding:10px 12px;font-weight:600;min-height:54px}
.u-item .tag{flex:0 0 26px;height:26px;border-radius:50%;border:2px dashed var(--ln);display:grid;place-items:center;font-family:'Orbitron',sans-serif;font-size:.7rem;color:#070714}
.u-item.act{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.15)}
.u-item.bien{border-color:var(--ok)!important}
.u-item.mal{border-color:var(--bad)!important}

/* clasificar */
.clasif{display:grid;gap:8px}
.c-fila{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--p1);border:2px solid var(--ln);border-radius:10px;padding:8px 10px 8px 14px;font-weight:600}
.c-fila.bien{border-color:var(--ok)}.c-fila.mal{border-color:var(--bad)}
.seg{display:flex;gap:6px}
.seg button{padding:8px 12px;border-radius:9px;border:2px solid var(--ln);background:var(--p2);font-weight:700;font-size:.9rem;white-space:nowrap}
.seg button.sel{border-color:var(--c,var(--cy));background:rgba(0,229,255,.12);color:#fff}

/* respuesta abierta */
.resp-num{display:flex;gap:10px;align-items:center;max-width:420px}
.resp-num .uni{font-family:'Orbitron',sans-serif;font-weight:700;color:var(--mu)}
.formula input{font-family:Consolas,'Courier New',monospace;font-size:1.25rem;letter-spacing:.04em}
.pista{margin-top:12px;background:rgba(255,209,102,.08);border:1px dashed var(--am);color:var(--am);padding:10px 14px;border-radius:10px;font-weight:600}

/* feedback */
.feedback{margin-top:16px;border-radius:12px;padding:14px 16px;font-weight:600;display:flex;gap:12px;align-items:flex-start;animation:aparece .25s}
.feedback.bien{background:rgba(56,245,154,.1);border:2px solid var(--ok)}
.feedback.medio{background:rgba(255,209,102,.1);border:2px solid var(--am)}
.feedback.mal{background:rgba(255,84,112,.1);border:2px solid var(--bad)}
.feedback .t{font-family:'Orbitron',sans-serif;font-size:.85rem;display:block;margin-bottom:4px}
.feedback.bien .t{color:var(--ok)}.feedback.medio .t{color:var(--am)}.feedback.mal .t{color:var(--bad)}
.feedback .sol{display:block;margin-top:6px;color:#fff}
@keyframes aparece{from{opacity:0;transform:translateY(6px)}}

/* hoja de cálculo */
.hoja{border-collapse:collapse;font-family:Arial,sans-serif;font-size:15px;background:#fff;color:#202124;border-radius:6px;overflow:hidden;min-width:340px}
.hoja th{background:#f1f3f4;color:#5f6368;font-weight:400;border:1px solid #dadce0;padding:3px 8px;font-size:13px}
.hoja td{border:1px solid #e2e3e3;padding:5px 10px;min-width:70px}
.hoja td.num{text-align:right}
.hoja td.b{font-weight:700}
.hoja td.act{outline:2px solid #217346;outline-offset:-2px;background:#e2efda}
.barra-f{display:flex;align-items:center;gap:8px;background:#fff;color:#202124;border:1px solid #dadce0;border-bottom:0;padding:4px 10px;font-family:Arial,sans-serif;font-size:14px;border-radius:6px 6px 0 0;min-width:340px}
.barra-f i{font-style:italic;color:#5f6368;font-family:Georgia,serif}

/* bloques */
.bloques{display:inline-flex;flex-direction:column;gap:4px;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:15px}
.bq{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:7px 10px;border-radius:8px;color:#fff;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.bq .f{background:rgba(255,255,255,.92);color:#222;border-radius:6px;padding:1px 7px;font-size:14px}
.bq.shapes{background:#2f86d6}.bq.modify{background:#8a5cf6}.bq.control{background:#e09a12}.bq.math{background:#3a9d5a}
.bq-hijos{margin:4px 0 2px 14px;padding-left:8px;border-left:6px solid #e09a12;display:flex;flex-direction:column;gap:4px}

/* cristal / modales */
.capa{position:fixed;inset:0;z-index:50;background:rgba(4,4,14,.82);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;animation:aparece .2s}
.modal{max-width:560px;width:100%;text-align:center}
.modal h2{font-size:1.35rem;margin:10px 0 6px}
.cristal-grande{width:130px;height:130px;margin:0 auto;display:block;animation:flota 2.4s ease-in-out infinite}
@keyframes flota{50%{transform:translateY(-8px) rotate(4deg)}}
.marcador{font-family:'Orbitron',sans-serif;font-size:2.4rem;font-weight:900;margin:6px 0}

/* jefe */
.jefe-zona{display:grid;grid-template-columns:220px 1fr;gap:18px;align-items:start}
.jefe-fig{position:sticky;top:70px;text-align:center}
.jefe-fig svg{width:100%;height:auto}
.vida{height:16px;border-radius:999px;background:var(--p3);border:1px solid var(--ln);overflow:hidden;margin-top:8px}
.vida i{display:block;height:100%;background:linear-gradient(90deg,var(--bad),var(--mg));transition:width .6s}
.golpe{animation:golpe .45s}
@keyframes golpe{20%{transform:translateX(-10px) scale(.95);filter:hue-rotate(90deg) brightness(1.6)}60%{transform:translateX(8px)}}

/* mecanografía */
.meca-texto{font-family:Consolas,'Courier New',monospace;font-size:1.3rem;line-height:1.8;background:var(--p1);border:2px solid var(--ln);border-radius:12px;padding:16px 18px;letter-spacing:.02em;word-break:break-word;cursor:text}
.meca-texto span{border-radius:3px}
.meca-texto .okc{color:var(--ok)}
.meca-texto .malc{color:#fff;background:var(--bad)}
.meca-texto .cur{background:rgba(0,229,255,.35);box-shadow:0 2px 0 var(--cy)}
.meca-texto .pend{color:var(--mu)}
.meca-in{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
.meca-stats{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}

/* final */
.nota-grande{font-family:'Orbitron',sans-serif;font-size:clamp(4rem,16vw,7rem);font-weight:900;line-height:1;background:linear-gradient(135deg,var(--cy),var(--mg));-webkit-background-clip:text;background-clip:text;color:transparent}
.desempeno{font-family:'Orbitron',sans-serif;font-size:1rem;letter-spacing:.2em;text-transform:uppercase;margin:6px 0 4px}
.barras{display:grid;gap:8px;margin:14px 0}
.barra{display:grid;grid-template-columns:150px 1fr 64px;gap:10px;align-items:center;font-weight:700;font-size:.95rem}
.barra .tr{height:12px;border-radius:999px;background:var(--p3);overflow:hidden}
.barra .tr i{display:block;height:100%;border-radius:999px}
.barra .v{font-family:'Orbitron',sans-serif;font-size:.75rem;text-align:right}
.insignias{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.insignia{background:var(--p1);border:1px solid var(--am);color:var(--am);border-radius:999px;padding:6px 12px;font-weight:700;font-size:.9rem}
.codigo-ver{font-family:'Orbitron',sans-serif;letter-spacing:.2em;font-size:1.2rem;color:var(--am)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:60;background:var(--p2);border:2px solid var(--am);color:var(--tx);padding:10px 18px;border-radius:12px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:aparece .2s;max-width:92vw;text-align:center}
.xp-flota{position:fixed;z-index:70;pointer-events:none;font-family:'Orbitron',sans-serif;font-weight:900;color:var(--ok);font-size:1.3rem;animation:subexp 1.1s forwards;text-shadow:0 0 12px rgba(56,245,154,.7)}
@keyframes subexp{to{transform:translateY(-70px);opacity:0}}
.confeti{position:fixed;inset:0;pointer-events:none;z-index:55}
.prueba-bar{background:rgba(255,209,102,.12);border:1px dashed var(--am);color:var(--am);border-radius:10px;padding:8px 12px;margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-weight:700}

@media (max-width:820px){
  .portada{grid-template-columns:1fr;min-height:auto}
  .escena-byte{order:-1}.escena-byte svg{width:min(220px,60vw)}
  .ordenar,.unir,.grid2{grid-template-columns:1fr}
  .jefe-zona{grid-template-columns:1fr}
  .jefe-fig{position:static;max-width:200px;margin:0 auto}
  .barra{grid-template-columns:110px 1fr 56px}
  .pregunta{font-size:1.15rem}
  .hud .quien b{max-width:120px}
}
@media (max-width:480px){
  html,body{font-size:17px}
  .wrap{padding:12px 16px 60px}
  .panel{padding:16px}
  .c-fila{grid-template-columns:1fr}
  .vf .op{padding:16px}

function lienzo(cont, W = 960, H = 540){

const JUEGOS = {};   // cada minijuego se registra aquí
const S = {
  curso:'', num:0, nombre:'', nombres:'', apellidos:'', corto:'', clave:'', usuario:'', modo:'normal',
  juegos:{}, datos:[], meca:null, vistos:{}, reflexion:'',
  inicio:'', tAcum:0, tIni:0, salidas:0, salioEn:0, intentos:1,
  terminado:false, sonido:true, fase:'login'
};
const est = id => ESTACIONES.find(e => e.id === id);
const estrellasDe = id => (S.juegos[id] || {}).est || 0;
const datosDe = id => S.datos.filter(d => d.startsWith(id + ':')).length;
const completa = id => estrellasDe(id) >= 1;
// Mapa abierto: todas las estaciones se pueden jugar en el orden que quieran.
const disponible = k => true;
// Siguiente estación sin terminar después de k (da la vuelta); -1 si ya terminó todas.
function siguientePendiente(k){
  for (let i = 1; i <= ORDEN.length; i++) { const j = (k + i) % ORDEN.length; if (!completa(ORDEN[j])) return j; }
  return -1;
}
function minutos(){ return (S.tAcum + (S.tIni ? Date.now() - S.tIni : 0)) / 60000; }
function resumen(){
  let comp = 0, extra = 0, total = 0, partidas = 0; const est = {}, dat = {};
  ORDEN.forEach(id => { const e = estrellasDe(id); est[id] = e; dat[id] = datosDe(id); total += e; partidas += (S.juegos[id] || {}).jug || 0; if (e >= 1) { comp++; extra += e - 1; } });
  const n = ORDEN.length, datos = S.datos.length;
  // Completar todo asegura 3,0; las estrellas extra y los datos suben hasta 5,0.
  const nota = r1(1 + 2 * comp / n + 2 * (.6 * extra / (2 * n) + .4 * datos / TOTAL_DATOS));
  return {est, dat, comp, total, datos, partidas, nota, notaP: Math.round(nota * 10), avance: datos + total + partidas};
}
const desempeno = n => DESEMPENOS.find(d => n >= d.min) || DESEMPENOS[DESEMPENOS.length - 1];
function estadoPersistente(){
  return {v:2, juegos:S.juegos, datos:S.datos, meca:S.meca, vistos:S.vistos, reflexion:S.reflexion, inicio:S.inicio,
    tAcum:Math.round(minutos() * 60000), salidas:S.salidas, intentos:S.intentos, terminado:S.terminado};
}
function aplicarEstado(st){
  if (!st || st.v !== 2) return false;
  S.juegos = st.juegos || {}; S.datos = st.datos || []; S.meca = st.meca || null; S.vistos = st.vistos || {};
  S.reflexion = st.reflexion || ''; S.inicio = st.inicio || S.inicio; S.tAcum = st.tAcum || 0; S.tIni = Date.now();
  S.salidas = st.salidas || 0; S.intentos = st.intentos || 1; S.terminado = !!st.terminado;
  return true;
}
function reiniciarProgreso(){
  S.juegos = {}; S.datos = []; S.meca = null; S.vistos = {}; S.reflexion = ''; S.tAcum = 0; S.tIni = Date.now();
  S.salidas = 0; S.terminado = false; S.inicio = new Date().toISOString();
}

/* =========================================================
   CONEXIÓN CON GOOGLE SHEETS (Apps Script)
   ========================================================= */
const conectado = () => !!SCRIPT_URL;
const RED = {timer:null, enCurso:false, pendiente:false, fallos:0, estado:'ok'};
async function api(cuerpo, ms = 20000){
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), ms);
  try {
    const res = await fetch(SCRIPT_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(cuerpo), signal:ctl.signal, redirect:'follow'});
    return await res.json();
  } finally { clearTimeout(t); }
}
// Solo se envía la NOTA FINAL: al terminar y cada vez que la mejoran después.
function paquete(){
  const R = resumen();
  return {accion:'nota', curso:S.curso, numero:S.num, nombre:S.nombre, usuario:S.usuario, modo:S.modo,
    nota:R.nota, notaPlanilla:R.notaP, estrellas:R.total, datos:R.datos, reflexion:S.reflexion};
}
function marcarRed(st){
  RED.estado = st;
  $$('.estado-guardado').forEach(d => { d.className = 'estado-guardado ' + st; d.title = {ok:'Nota enviada', pend:'Enviando la nota…', err:'Sin conexión: reintentando'}[st]; });
  $$('[data-envio]').forEach(el => pintarEnvio(el));
}
function guardar(inmediato){
  if (!S.terminado) return;
  if (!conectado()) { marcarRed('ok'); return; }
  RED.pendiente = true; marcarRed('pend');
  clearTimeout(RED.timer); RED.timer = setTimeout(enviar, inmediato ? 60 : 1500);
}
async function enviar(){
  RED.timer = null;
  if (RED.enCurso) { RED.timer = setTimeout(enviar, 1200); return; }
  if (!RED.pendiente) return;
  RED.enCurso = true; RED.pendiente = false;
  try {
    const r = await api(paquete());
    if (r && r.ok) { RED.fallos = 0; if (!RED.pendiente) marcarRed('ok'); }
    else throw new Error((r && r.error) || 'respuesta inválida');
  } catch (e) {
    RED.pendiente = true; RED.fallos++; marcarRed('err');
    RED.timer = setTimeout(enviar, Math.min(30000, 3000 * RED.fallos));
  } finally {
    RED.enCurso = false;
    if (RED.pendiente && !RED.timer) RED.timer = setTimeout(enviar, 1500);
  }
}

const POS = [[100,440],[245,250],[400,430],[545,230],[690,430],[830,240],[905,455]];

  let fondo = ''; let sd = 7;

    const [x1, y1] = POS[k], [x2, y2] = POS[k + 1]; const cx = (x1 + x2) / 2, cy = Math.min(y1, y2) - 40 + (k % 2 ? 80 : 0);

  }
  let nodos = '', actual = -1;
  ESTACIONES.forEach((e, k) => {
    const [x, y] = POS[k]; const esJefe = k === 6;
    const disp = disponible(k), hecho = completa(e.id);
    if (disp && !hecho && actual < 0) actual = k;
    const R = esJefe ? 46 : 40; const c = disp ? e.color : '#3a3a66';
    const ne = estrellasDe(e.id);
    const estr = hecho ? [0, 1, 2].map(i => `<path transform="translate(${x - 30 + i * 20} ${y + R - 8}) scale(.8)" d="${ICONOS.estrella.match(/d="([^"]+)"/)[1]}" fill="${i < ne ? '#ffd166' : '#2a2a50'}" stroke="#070714" stroke-width="1.5"/>`).join('') : '';
    nodos += `<g class="nodo ${disp ? '' : 'bloq'}" data-k="${k}" tabindex="${disp ? 0 : -1}" role="button" aria-label="${esc(e.herramienta)}${disp ? '' : ' (bloqueada)'}">
      ${disp && !hecho ? `<circle class="halo" cx="${x}" cy="${y}" r="${R + 8}" fill="none" stroke="${c}" stroke-width="3"/>` : ''}
      <circle class="cuerpo" cx="${x}" cy="${y}" r="${R}" fill="${hecho ? e.color + '33' : '#0d0d22'}" stroke="${c}" stroke-width="4"/>
      <g transform="translate(${x - 18} ${y - 22}) scale(1.5)" stroke="${disp ? c : '#4a4a7a'}" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONOS[disp ? e.icono : 'candado']}</g>

/* =========================================================
   CONFETI
   ========================================================= */
function confeti(ms){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv = document.createElement('canvas'); cv.className = 'confeti'; document.body.appendChild(cv);
  const ctx = cv.getContext('2d'); const W = cv.width = innerWidth, H = cv.height = innerHeight;
  const cols = ['#00e5ff', '#ff2bd6', '#ffd166', '#38f59a', '#9d6bff'];
  const ps = Array.from({length:90}, () => ({x:Math.random() * W, y:-20 - Math.random() * H * .4, vx:(Math.random() - .5) * 3, vy:2 + Math.random() * 3, s:4 + Math.random() * 6, c:cols[Math.floor(Math.random() * 5)], r:Math.random() * 6}));
  const t0 = performance.now();
  (function paso(t){
    ctx.clearRect(0, 0, W, H);
    ps.forEach(p => { p.x += p.vx; p.y += p.vy; p.r += .1; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); });
    if (t - t0 < ms) requestAnimationFrame(paso); else cv.remove();
  })(t0);
}
